<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>animation-motion</title>
  <link rel="stylesheet" href="/editor/style.css">
</head>
<body>
  <h1>animation-motion</h1>
  <div class="app">
    <div class="col stage">
      <div class="stagewrap"><canvas id="cv" class="h" width="1280" height="720"></canvas></div>
      <div class="box">
        <div class="bar">
          <button id="play" class="primary" style="min-width:84px">Пауза</button>
          <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Время">
          <span class="time" id="time">0.0 / 12.0 с</span>
        </div>
        <div class="bar" style="margin-top:8px">
          <span class="seg" id="aspect">
            <button id="aspectH" data-a="h" class="on">16:9</button>
            <button id="aspectV" data-a="v">9:16</button>
          </span>
        </div>
        <div id="err" class="msg err" hidden></div>
        <ul id="errList" class="errs"></ul>
        <pre id="selftest" hidden></pre>
      </div>
    </div>
    <div class="col">
      <div class="box">
        <h2>Код сцены</h2>
        <textarea id="json" spellcheck="false" rows="14" aria-label="JSON сцены"></textarea>
        <div class="btns">
          <button id="apply" class="primary">Применить</button>
          <button id="reset">Сбросить к демо</button>
        </div>
        <p class="hint">Вставьте JSON сцены и нажмите «Применит». Ошибки валидации появятся ниже холста.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/editor/main.ts"></script>
</body>
</html>
